openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enrollment
    description: Applicant enrollment and application operations
  - name: administration
    description: Administrator application review and support
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enrollment/categories:
    get:
      operationId: listEnrollmentCategories
      tags: [enrollment]
      summary: List the four available enrollment categories
      responses:
        "200":
          description: Available enrollment categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentCategory"
  /me/applications:
    get:
      operationId: listMyApplications
      tags: [enrollment]
      summary: List the signed-in applicant's applications
      responses:
        "200":
          description: Applicant applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentApplication"
  /me/drafts:
    delete:
      operationId: deleteMyDrafts
      tags: [enrollment]
      summary: Delete unfinished applications belonging to the signed-in applicant
      responses:
        "200":
          description: Number of unfinished applications deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMyApplicationDraftsResponse"
  /applications/submit:
    post:
      operationId: submitNewApplication
      tags: [enrollment]
      summary: Validate and submit a completed application without storing a draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewApplicationSubmissionInput"
      responses:
        "201":
          description: Submitted application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
  /applications/{applicationId}:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getApplication
      tags: [enrollment]
      summary: Get an application owned by the signed-in applicant
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
    patch:
      operationId: updateApplication
      tags: [enrollment]
      summary: Save changes to an application draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
  /applications/{applicationId}/submit:
    post:
      operationId: submitApplication
      tags: [enrollment]
      summary: Submit a completed application for review
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistingApplicationSubmissionInput"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submitted application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
  /dashboard/summary:
    get:
      operationId: getApplicantSummary
      tags: [enrollment]
      summary: Get applicant dashboard summary
      responses:
        "200":
          description: Applicant dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantSummary"
  /admin/applications:
    get:
      operationId: listApplicationsForReview
      tags: [administration]
      summary: List applications for authorized administrators
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [submitted, under_review, needs_information, approved, rejected]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Applications matching the review filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentApplication"
  /admin/applications/{applicationId}:
    get:
      operationId: getAdminApplication
      tags: [administration]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full enrollment record for an authorized reviewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [administration]
      summary: Get administrator dashboard totals
      responses:
        "200":
          description: Database-backed overview totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [administration]
      summary: Search and list user accounts with enrollment status
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: accountStatus
          in: query
          schema:
            type: string
            enum: [active, suspended]
      responses:
        "200":
          description: User accounts and latest enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
  /admin/users/{userId}/status:
    patch:
      operationId: updateAdminUserStatus
      tags: [administration]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserStatusUpdate"
      responses:
        "200":
          description: Updated account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /admin/users/{userId}/role:
    patch:
      operationId: updateAdminUserRole
      tags: [administration]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserRoleUpdate"
      responses:
        "200":
          description: Updated staff role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /portal/settings:
    get:
      operationId: getPortalSettings
      tags: [portal]
      summary: Get public portal content and theme settings
      responses:
        "200":
          description: Portal theme and editable content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSettings"
  /admin/settings:
    put:
      operationId: updatePortalSettings
      tags: [administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalSettings"
      responses:
        "200":
          description: Updated portal settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSettings"
  /admin/applications/{applicationId}/history:
    get:
      operationId: getAdminApplicationHistory
      tags: [administration]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationEvent"
  /admin/applications/{applicationId}/notes:
    post:
      operationId: addAdminApplicationNote
      tags: [administration]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationNoteInput"
      responses:
        "201":
          description: Internal note recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEvent"
  /admin/applications/{applicationId}/decision:
    post:
      operationId: decideApplication
      tags: [administration]
      summary: Approve, reject, or request more information
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationDecision"
      responses:
        "200":
          description: Application decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
  /support/tickets:
    get:
      operationId: listMySupportTickets
      tags: [enrollment]
      summary: List the signed-in applicant's support requests
      responses:
        "200":
          description: Support requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicket"
    post:
      operationId: createSupportTicket
      tags: [enrollment]
      summary: Create a support request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Support request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
  /support/tickets/{ticketId}/messages:
    post:
      operationId: addApplicantSupportMessage
      tags: [enrollment]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessageInput"
      responses:
        "201":
          description: Applicant message added to the conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
  /admin/support/tickets:
    get:
      operationId: listSupportTicketsForAdmin
      tags: [administration]
      summary: List support requests for authorized administrators
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved]
      responses:
        "200":
          description: Support requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicket"
  /admin/support/tickets/{ticketId}/reply:
    post:
      operationId: replyToSupportTicket
      tags: [administration]
      summary: Reply to and manage a support request
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportReplyInput"
      responses:
        "200":
          description: Updated support request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
  /admin/support/tickets/{ticketId}/assignment:
    patch:
      operationId: assignSupportTicket
      tags: [administration]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportAssignmentInput"
      responses:
        "200":
          description: Support request assigned to an authorized administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EnrollmentCategory:
      type: object
      required: [id, name, description, accent]
      properties:
        id:
          type: string
          enum: [category-1, category-2, category-3, category-4]
        name:
          type: string
        description:
          type: string
        accent:
          type: string
    ApplicationStatus:
      type: string
      enum: [draft, submitted, under_review, needs_information, approved, rejected]
    EnrollmentApplication:
      type: object
      required: [id, reference, categoryId, categoryName, status, currentStep, hasPin, answers, createdAt, updatedAt]
      properties:
        id:
          type: string
        reference:
          type: string
        categoryId:
          type: string
          enum: [category-1, category-2, category-3, category-4]
        categoryName:
          type: string
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        currentStep:
          type: integer
        hasPin:
          type: boolean
        answers:
          type: object
          additionalProperties: true
        applicantName:
          type: ["string", "null"]
        applicantEmail:
          type: ["string", "null"]
        reviewNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          type: ["string", "null"]
          format: date-time
    ApplicationInput:
      type: object
      required: [categoryId]
      properties:
        categoryId:
          type: string
          enum: [category-1, category-2, category-3, category-4]
    NewApplicationSubmissionInput:
      type: object
      required: [submissionId, categoryId, answers, pin]
      properties:
        submissionId:
          type: string
          format: uuid
        categoryId:
          type: string
          enum: [category-1, category-2, category-3, category-4]
        answers:
          type: object
          additionalProperties: true
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
        pinConfirmation:
          type: string
          pattern: "^[0-9]{4,6}$"
    ExistingApplicationSubmissionInput:
      type: object
      properties:
        categoryId:
          type: string
          enum: [category-1, category-2, category-3, category-4]
        answers:
          type: object
          additionalProperties: true
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
        pinConfirmation:
          type: string
          pattern: "^[0-9]{4,6}$"
    DeleteMyApplicationDraftsResponse:
      type: object
      required: [deletedCount]
      properties:
        deletedCount:
          type: integer
          minimum: 0
    ApplicationUpdate:
      type: object
      properties:
        categoryId:
          type: string
          enum: [category-1, category-2, category-3, category-4]
        currentStep:
          type: integer
          minimum: 0
          maximum: 7
        answers:
          type: object
          additionalProperties: true
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
        pinConfirmation:
          type: string
          pattern: "^[0-9]{4,6}$"
    ApplicationDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject, request_information, mark_under_review]
        note:
          type: string
          maxLength: 4000
        reopenSections:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          minItems: 1
          maxItems: 7
          uniqueItems: true
    ApplicationNoteInput:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 4000
    ApplicationEvent:
      type: object
      required: [id, eventType, note, createdAt, actorUserId]
      properties:
        id:
          type: string
        eventType:
          type: string
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        actorUserId:
          type: string
    AdminOverview:
      type: object
      required: [totalUsers, totalApplications, pendingApplications, underReviewApplications, approvedApplications, rejectedApplications, needsInformationApplications, unresolvedSupportRequests]
      properties:
        totalUsers: { type: integer }
        totalApplications: { type: integer }
        pendingApplications: { type: integer }
        underReviewApplications: { type: integer }
        approvedApplications: { type: integer }
        rejectedApplications: { type: integer }
        needsInformationApplications: { type: integer }
        unresolvedSupportRequests: { type: integer }
    AdminUser:
      type: object
      required: [userId, name, username, email, role, accountStatus, applicationId, categoryId, categoryName, applicationReference, registrationDate, enrollmentStatus]
      properties:
        userId: { type: string }
        name: { type: ["string", "null"] }
        username: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        role: { type: string, enum: [applicant, admin, sub_admin, moderator] }
        accountStatus: { type: string, enum: [active, suspended] }
        applicationId: { type: ["string", "null"] }
        categoryId: { type: ["string", "null"] }
        categoryName: { type: ["string", "null"] }
        applicationReference: { type: ["string", "null"] }
        registrationDate: { type: string, format: date-time }
        enrollmentStatus: { type: ["string", "null"] }
    AdminUserList:
      type: object
      required: [users, totalCount]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        totalCount: { type: integer }
    AdminUserStatusUpdate:
      type: object
      required: [accountStatus]
      properties:
        accountStatus:
          type: string
          enum: [active, suspended]
    AdminUserRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [applicant, admin, sub_admin, moderator]
    PortalSettings:
      type: object
      required: [hero, cards, theme, screenCopy]
      properties:
        hero:
          type: object
          required: [title, description, getStartedLabel, loginLabel]
          properties:
            title: { type: string, maxLength: 160 }
            description: { type: string, maxLength: 500 }
            getStartedLabel: { type: string, maxLength: 60 }
            loginLabel: { type: string, maxLength: 60 }
        cards:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [id, title, description, buttonLabel, backgroundColor, logoDataUrl]
            properties:
              id: { type: string, enum: [category-1, category-2, category-3, category-4] }
              title: { type: string, maxLength: 100 }
              description: { type: string, maxLength: 240 }
              buttonLabel: { type: string, maxLength: 60 }
              backgroundColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
              logoDataUrl: { type: ["string", "null"], maxLength: 6000000 }
        theme:
          type: object
          required: [pinScreenBackground, buttonSize, buttonPlacement, categoryInputTransparent]
          properties:
            pinScreenBackground: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
            buttonSize: { type: string, enum: [compact, standard, large] }
            buttonPlacement: { type: string, enum: [left, center, right] }
            categoryInputTransparent: { type: boolean }
        screenCopy:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
              maxLength: 500
        pageThemes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PortalPageTheme"
    PortalPageTheme:
      type: object
      required: [mode, color, blendColor, angle]
      properties:
        mode: { type: string, enum: [inherit, solid, gradient] }
        color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        blendColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        angle: { type: integer, minimum: 0, maximum: 360 }
    ApplicantSummary:
      type: object
      required: [total, drafts, inReview, approved, needsAttention]
      properties:
        total:
          type: integer
        drafts:
          type: integer
        inReview:
          type: integer
        approved:
          type: integer
        needsAttention:
          type: integer
    SupportTicket:
      type: object
      required: [id, applicantUserId, applicationId, applicationReference, subject, category, message, messages, assignedToUserId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        applicantUserId:
          type: string
        applicationId:
          type: ["string", "null"]
        applicationReference:
          type: ["string", "null"]
        subject:
          type: string
        category:
          type: string
          enum: [enrollment, account, technical, documents, other]
        message:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SupportMessage"
        assignedToUserId:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, in_progress, resolved, answered, closed]
        response:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SupportTicketInput:
      type: object
      required: [subject, category, message]
      properties:
        applicationId:
          type: ["string", "null"]
        subject:
          type: string
          minLength: 3
          maxLength: 200
        category:
          type: string
          enum: [enrollment, account, technical, documents, other]
        message:
          type: string
          minLength: 5
          maxLength: 5000
    SupportReplyInput:
      type: object
      required: [response, status]
      properties:
        response:
          type: string
          minLength: 1
          maxLength: 5000
        status:
          type: string
          enum: [open, in_progress, resolved]
    SupportMessage:
      type: object
      required: [id, actorUserId, actorRole, body, createdAt]
      properties:
        id: { type: string }
        actorUserId: { type: string }
        actorRole: { type: string, enum: [applicant, administrator] }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    SupportMessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 5000
    SupportAssignmentInput:
      type: object
      required: [assigneeUserId]
      properties:
        assigneeUserId:
          type: ["string", "null"]

